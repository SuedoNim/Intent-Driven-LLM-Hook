[project]
name = "podman-ai-lab"
version = "0.1.0"
description = "Autonomous, self-evolving AI development lab running under Podman Quadlet"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Principal AI Systems Architect", email = "architect@podman-ai-lab.internal" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "google-genai>=0.1.1",
    "mcp>=1.1.2",
    "jinja2>=3.1.4",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.0",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
